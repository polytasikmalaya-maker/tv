  <!-- AUTO-UNREGISTER SERVICE WORKER & PURGE STALE CACHES -->
  <script>
    window.CURRENT_APP_VERSION = '20261021_v138';
    (function() {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) {
            caches.delete(names[i]);
          }
        }).catch(function() {});
      }
      // SMART TV / ANDROID TV PROACTIVE AUTO-UPDATE CHECK
      if (window.location.protocol.startsWith('http')) {
        fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' })
          .then(function(res) { return res.ok ? res.json() : null; })
          .then(function(data) {
            if (!data || !data.version) return;
            var url = new URL(window.location.href);
            var queryVer = url.searchParams.get('v');
            if (window.CURRENT_APP_VERSION && window.CURRENT_APP_VERSION !== data.version) {
              console.log('[SMART-TV-SYNC] Versi baru ditemukan:', data.version);
              url.searchParams.set('v', data.version);
              url.searchParams.set('_t', Date.now());
              window.location.replace(url.toString());
            }
          })
          .catch(function() {});
      }
    })();
  </script>

  <style>
    /* ============================================================== */
    /* STANDALONE PURE CSS - POLYTRON EV RED GRADIENT SIGNATURE THEME */
    /* Background: Merah Tua ke Merah Muda (Sama Persis Menu Lain)    */
    /* 1 Tema Tunggal · Card Putih Bersih · Teks Wrap · 2 Kotak/Baris */
    /* ============================================================== */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      height: 100vh !important;
      max-height: 100vh !important;
      width: 100vw !important;
      max-width: 100vw !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
      color: #0c2340;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* WRAPPER SCREEN UNTUK KONTROL ROTASI (LANDSCAPE / PORTRAIT 90° / 270°) */
    #tvScreenWrapper {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      overflow: hidden !important;
      position: relative !important;
      display: flex !important;
      flex-direction: column !important;
      box-sizing: border-box !important;
      margin: 0 !important;
      padding: 0 !important;
      transition: background 0.3s ease;
    }

    body.tv-rot-0 #tvScreenWrapper {
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      position: relative !important;
      top: 0 !important;
      left: 0 !important;
      transform: none !important;
    }

    body.tv-rot-90 #tvScreenWrapper {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      width: 100vh !important;
      height: 100vw !important;
      max-width: 100vh !important;
      max-height: 100vw !important;
      transform: translate(-50%, -50%) rotate(90deg) !important;
      transform-origin: center center !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
      margin: 0 !important;
    }

    body.tv-rot-270 #tvScreenWrapper {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      width: 100vh !important;
      height: 100vw !important;
      max-width: 100vh !important;
      max-height: 100vw !important;
      transform: translate(-50%, -50%) rotate(270deg) !important;
      transform-origin: center center !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
      margin: 0 !important;
    }

    body.tv-rot-180 #tvScreenWrapper {
      position: fixed !important;
      top: 50% !important;
      left: 50% !important;
      width: 100% !important;
      height: 100% !important;
      max-width: 100% !important;
      max-height: 100% !important;
      transform: translate(-50%, -50%) rotate(180deg) !important;
      transform-origin: center center !important;
      overflow: hidden !important;
      box-sizing: border-box !important;
      margin: 0 !important;

    /* Container Utama Monitor TV: Elastis 100% Pas Mengisi Layar, Padding 3mm di Semua Sisi */
    #tvContainer {
      height: 100% !important;
      width: 100% !important;
      max-height: 100% !important;
      max-width: 100% !important;
      overflow: hidden !important;
      padding: 3mm !important;
      box-sizing: border-box !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      gap: 3mm !important;
      flex: 1 1 0% !important;
      min-height: 0 !important;
      margin: 0 !important;

    /* ============================================================== */
    /* TOP HEADER & CONTROLS                                          */
    /* ============================================================== */
    .tv-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-shrink: 0;

    }

    /* LOGO RESMI POLYTRON PERSIS DI ATAS JUDUL (AGAK BESAR SEDIKIT DARI JUDUL) */

      align-items: center;
      line-height: 1;

    }

    .tv-polytron-brand-logo {

      max-width: clamp(200px, 25vw, 290px);

    .tv-brand-block {

    .tv-time-block {

    #tvSiteSelector {

      color: #ffffff !important;

    /* BODY TABEL: MENGISI PENUH SCREEN VERTIKAL ELASTIS DENGAN ANIMASI TRANSISI HALUS */
    .tv-table-body {
      flex: 1 1 0%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow-y: hidden;
      overflow-x: hidden;
      gap: 0px;
      padding: 0px;
      will-change: opacity, transform;
    }

    .tv-schedule-row {
      display: grid !important;
      grid-template-columns: 150px 1fr 1fr !important;
      align-items: stretch !important;
      gap: 6px !important;

      max-width: 100% !important;

    /* SHADING BARIS BELANG-BELANG PERSIS FOTO */
    .tv-schedule-row:nth-child(odd) {
      background-color: #ffffff;
    }

    .tv-schedule-row:nth-child(even) {
      background-color: #f1f7fd;
    }

      border-left: 4px solid #0284c7 !important;
    }

    .tv-col-time {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding-left: 0;
      line-height: 1.15;
      gap: 1px;
      user-select: none;
    }

    .tv-time-main {

    /* TOAST FLOATING SIARAN PANGGILAN SUARA (UKURAN PROPORSIONAL & ELEGAN DI LAYAR TV) */
    #activeCallToast {
      position: absolute;
      top: clamp(16px, 2.2vh, 26px);
      left: 50%;
      transform: translateX(-50%) scale(1);
      background: #b91c1c;
      background: linear-gradient(135deg, #991b1b 0%, #dc2626 50%, #ef4444 100%);
      color: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 20px rgba(220, 38, 38, 0.45);
      border-radius: 6px;
      padding: clamp(8px, 1.2vh, 14px) clamp(20px, 2.4vw, 36px);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 1.2vw, 16px);
      font-size: clamp(1.05rem, 1.45vw + 0.25vh, 1.55rem);
      font-weight: 900;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-align: center;
      white-space: nowrap;
      max-width: 90%;
      box-sizing: border-box;
      pointer-events: auto;
      transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      animation: callToastPulse 1.8s infinite ease-in-out;
    }

    @keyframes callToastPulse {
      0%, 100% {
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55), 0 0 16px rgba(239, 68, 68, 0.4);
      }
      50% {
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 28px rgba(239, 68, 68, 0.7);
      }
    }

    #activeCallToast svg {
      width: clamp(24px, 2.2vw, 32px) !important;
      height: clamp(24px, 2.2vw, 32px) !important;
      flex-shrink: 0;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
      animation: speakerIconShake 1.2s infinite ease-in-out;
    }

    @keyframes speakerIconShake {
      0%, 100% { transform: scale(1); }
      25% { transform: scale(1.1) rotate(-5deg); }
      75% { transform: scale(1.1) rotate(5deg); }
    }

    #activeCallToast.hidden {
      top: -160px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) scale(0.9);
    }

    /* TOAST PENGAKTIF SUARA (JIKA AUTOPLAY DIBLOKIR BROWSER) */
    #audioUnlockToast {

    let currentSiteId = localStorage.getItem(SITE_KEY) || localStorage.getItem('POLYTRON_ACTIVE_SITE_ID') || (SITES.find(s => s.id.includes('tasik')) ? SITES.find(s => s.id.includes('tasik')).id : (SITES[0] ? SITES[0].id : 'tasik'));

    function findSite(idOrCodeOrName) {
      if (!idOrCodeOrName) return null;
      const raw = String(idOrCodeOrName).toLowerCase().trim();
      const clean = raw.replace(/polytron/g, '').replace(/service\s*center/g, '').replace(/sc/g, '').replace(/[^a-z0-9]/g, '');

      // 1. Direct match by id or code
      let found = SITES.find(s => s && (
        (s.id && String(s.id).toLowerCase().trim() === raw) ||
        (s.code && String(s.code).toLowerCase().trim() === raw)
      ));
      if (found) return found;

      // 2. Direct match by name
      found = SITES.find(s => s && s.name && String(s.name).toLowerCase().trim() === raw);
      if (found) return found;

      // 3. Match by clean keyword
      found = SITES.find(s => {
        if (!s) return false;
        const sIdClean = String(s.id || '').toLowerCase().replace(/polytron/g, '').replace(/sc/g, '').replace(/[^a-z0-9]/g, '');
        const sCodeClean = String(s.code || '').toLowerCase().replace(/[^a-z0-9]/g, '');
        const sNameClean = String(s.name || '').toLowerCase().replace(/polytron/g, '').replace(/service\s*center/g, '').replace(/sc/g, '').replace(/[^a-z0-9]/g, '');
        return (clean && (clean === sIdClean || clean === sCodeClean || clean === sNameClean));
      });
      if (found) return found;

      // 4. Special alias for tasik / tasikmalaya
      if (clean === 'tasik' || clean === 'tasikmalaya') {
        found = SITES.find(s => {
          const sId = String(s.id || '').toLowerCase();
          const sName = String(s.name || '').toLowerCase();
          return sId.includes('tasik') || sName.includes('tasik');
        });
        if (found) return found;
      }

      return null;
    }

    function getSiteCode(siteId) {
      if (!siteId) return '';
      const s = findSite(siteId);
      if (s && s.code && /^[A-Z0-9]{2,4}$/i.test(s.code)) {
        return s.code.toUpperCase();
      }
      return '';
    }

    function initTvSiteDropdown() {
      const sel = document.getElementById('tvSiteSelector');
      if (!sel) return;
      sel.innerHTML = '';
      SITES.forEach(function(s) {
        const opt = document.createElement('option');
        opt.value = s.id;
        const code = (s.code || getSiteCode(s.id) || s.id).toUpperCase();
        let nameClean = (s.name || s.id).replace(/^(Polytron\s+(?:EV\s+)?(?:Service\s+Center|SC)\s+)/i, '').trim();
        nameClean = nameClean.split(' - ')[0].split(' – ')[0].split(',')[0].trim();
        // HANYA MUNCULKAN KODE CABANG (MISAL: TSM, SKB, PPS)
        opt.innerText = code;
        opt.title = `${code} - ${nameClean}`;
        if (s.id === currentSiteId) opt.selected = true;
        sel.appendChild(opt);
      });
      sel.value = currentSiteId;
      const siteBox = document.querySelector('.tv-site-box');
      if (siteBox) {
        const activeSite = findSite(currentSiteId);
        if (activeSite) {
          const c = (activeSite.code || getSiteCode(activeSite.id) || currentSiteId).toUpperCase();
          siteBox.title = `Cabang: [${c}] ${activeSite.name || ''}`;
        }
      }
    }

    function handleTvSiteChange(newSiteId, isRemote = false) {
      if (!newSiteId) return;
      currentSiteId = newSiteId;
      localStorage.setItem(SITE_KEY, newSiteId);
      localStorage.setItem('POLYTRON_ACTIVE_SITE_ID', newSiteId);

      // Batalkan panggilan suara aktif dan sembunyikan toast jika berganti area
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      hideActiveCallToast();

      const sel = document.getElementById('tvSiteSelector');
      if (sel && sel.value !== newSiteId) sel.value = newSiteId;

      const activeSiteObj = SITES.find(s => s.id === newSiteId) || SITES[0];
      const hoursText = document.getElementById('tvFooterHoursText');
      if (hoursText) {
        const isTvDateSat = isSaturday(getLocalDateIso());
        hoursText.innerText = isTvDateSat 
          ? 'Batas booking servis 08.30 – 11.30 (Sabtu & Minggu)' 
          : 'Batas booking servis 08.30 – 14.30 (Senin - Jumat)';
      }

      renderScheduleTable();

      // Sinkronisasi otomatis ke aplikasi operasional (SA & Teknisi)
      if (!isRemote) {
        const siteCode = getSiteCode(newSiteId);
        const siteObj = findSite(newSiteId);
        const payload = {
          type: 'SITE_CHANGED',
          siteId: newSiteId,
          siteCode: siteCode,
          siteName: siteObj ? siteObj.name : newSiteId,
          timestamp: Date.now()
        };

        if (typeof BroadcastChannel !== 'undefined') {
          try {
            const bc = new BroadcastChannel('polytron_ev_sync_channel');
            bc.postMessage(payload);
          } catch (e) {}
        }

        if (globalMqttClient && globalMqttClient.connected) {
          try {
            globalMqttClient.publish('polytron/ev/global/site_sync', JSON.stringify(payload));
          } catch (e) {}
        }
      }
    }

    // KATEGORI AKTIF: 'reguler' (Stall 1 & 2) ATAU 'express' (Express Bay: 2 slot per baris)
    let currentCategory = localStorage.getItem(CATEGORY_KEY) || 'reguler';
    let tvCategoryRotationInterval = null;
    let isInitialCategoryLoad = true;
    let isCategorySwitching = false;

    function updateCategorySwitcherButtons(cat) {
      const btnReg = document.getElementById('btnCatReguler');
      const btnExp = document.getElementById('btnCatExpress');
      if (btnReg && btnExp) {
        if (cat === 'reguler') {
          btnReg.classList.add('active');
          btnExp.classList.remove('active');
        } else {
          btnReg.classList.remove('active');
          btnExp.classList.add('active');

    }

    function updateTableHeaderTitles(cat) {
      const thCol1 = document.getElementById('tvThCol1');
      const thCol2 = document.getElementById('tvThCol2');

        if (cat === 'reguler') {

    // PERPINDAHAN KATEGORI DENGAN ANIMASI SLIDE & FADE ELEGAN
    function setViewCategory(cat, isUserClick = false) {
      // Jika pertama kali dimuat saat halaman dibuka: render langsung tanpa jeda
      if (isInitialCategoryLoad) {
        isInitialCategoryLoad = false;
        currentCategory = cat;
        localStorage.setItem(CATEGORY_KEY, cat);
        updateCategorySwitcherButtons(cat);
        updateTableHeaderTitles(cat);
        renderScheduleTable(true);
        startTvCategoryRotation();
        return;
      }

      // Jika kategori sama dan tidak sedang animasi, cukup refresh jika user klik
      if (currentCategory === cat && !isCategorySwitching) {
        if (isUserClick) startTvCategoryRotation();
        return;
      }

      if (isCategorySwitching) return; // Mencegah double tap saat animasi berjalan
      isCategorySwitching = true;

      const prevCat = currentCategory;
      currentCategory = cat;
      localStorage.setItem(CATEGORY_KEY, cat);
      updateCategorySwitcherButtons(cat);

      const tableBody = document.getElementById('tvTableBody');
      const thCol1 = document.getElementById('tvThCol1');
      const thCol2 = document.getElementById('tvThCol2');

      // Arah slide: Reguler -> Express slide ke kiri; Express -> Reguler slide ke kanan
      const isSlideLeft = (cat === 'express');

      if (tableBody) {
        // FASE 1: Slide Out & Fade Lembut (Durasi Lebih Lambat, Anggun & Tenang)
        tableBody.style.transition = 'opacity 0.45s ease-out, transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1)';
        tableBody.style.opacity = '0';
        tableBody.style.transform = isSlideLeft ? 'translateX(-48px)' : 'translateX(48px)';

        if (thCol1) {
          thCol1.style.transition = 'opacity 0.35s ease';
          thCol1.style.opacity = '0.2';
        }
        if (thCol2) {
          thCol2.style.transition = 'opacity 0.35s ease';
          thCol2.style.opacity = '0.2';
        }

        setTimeout(function() {
          // Update Header Kolom Stall
          updateTableHeaderTitles(cat);
          if (thCol1) thCol1.style.opacity = '1';
          if (thCol2) thCol2.style.opacity = '1';

          // Reset dataset cache dan render ulang baris baru
          tableBody.dataset.renderedHtml = '';
          renderScheduleTable(true);

          // FASE 2: Posisikan tabel baru di sisi sebaliknya tanpa transisi
          tableBody.style.transition = 'none';
          tableBody.style.transform = isSlideLeft ? 'translateX(48px)' : 'translateX(-48px)';

          // Force reflow agar transisi berikutnya terbaca browser
          void tableBody.offsetWidth;

          // FASE 3: Slide In dengan easing natural, santai & sangat halus
          tableBody.style.transition = 'opacity 0.65s ease-out, transform 0.7s cubic-bezier(0.16, 1, 0.3, 1)';
          tableBody.style.opacity = '1';
          tableBody.style.transform = 'translateX(0)';

          setTimeout(function() {
            isCategorySwitching = false;
          }, 720);
        }, 500);
      } else {
        updateTableHeaderTitles(cat);
        renderScheduleTable(true);
        isCategorySwitching = false;
      }

      // Jika diklik manual oleh user, reset interval rotasi 3 menit
      if (isUserClick) {
        startTvCategoryRotation();
      }
    }

    // ROTASI OTOMATIS BERPINDAH ANTARA REGULER DAN EXPRESS SETIAP 3 MENIT SEKALI
    function startTvCategoryRotation() {
      if (tvCategoryRotationInterval) {
        clearInterval(tvCategoryRotationInterval);
      }
      tvCategoryRotationInterval = setInterval(function() {
        const nextCat = currentCategory === 'reguler' ? 'express' : 'reguler';
        setViewCategory(nextCat, false);
      }, 3 * 60 * 1000); // Tepat 3 menit
    }

    // AUTO-UPDATE DARI GITHUB PAGES (ANTI-STALE CACHE SMART TV) DENGAN AUTO-RELOAD CERDAS
    function checkHostingVersionUpdate() {
      if (window.location.protocol === 'file:' || !window.location.protocol.startsWith('http')) {
        return;
      }
      fetch('./version.json?_t=' + Date.now(), { cache: 'no-store' })
        .then(function(res) {
          if (!res.ok) return null;
          return res.json();
        })
        .then(function(data) {
          if (data && data.version && data.version !== CURRENT_APP_VERSION) {
            console.log('[AUTO-UPDATE] Versi baru terdeteksi di server:', data.version, 'vs', CURRENT_APP_VERSION);
            if ('caches' in window) {
              caches.keys().then(function(names) {
                for (var i = 0; i < names.length; i++) caches.delete(names[i]);
              });
            }
            try { sessionStorage.clear(); } catch(e) {}
            // Auto reload TV dengan query param versi terbaru agar Smart TV langsung menampilkan desain terkini
            var newUrl = new URL(window.location.href);
            newUrl.searchParams.set('v', data.version);
            newUrl.searchParams.set('_t', Date.now());
            window.location.replace(newUrl.toString());
          }
        })
        .catch(function() {});
    }

    // FUNGSI RELOAD PAKSA DARI LAYAR TV (BYPASS CACHE)
    function forceTvHardReload() {
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var i = 0; i < names.length; i++) caches.delete(names[i]);
        });
      }
      try { sessionStorage.clear(); } catch(e) {}
      var targetUrl = new URL(window.location.href);
      targetUrl.searchParams.set('v', '20261020_v120');
      targetUrl.searchParams.set('_t', Date.now());
      window.location.replace(targetUrl.toString());
    }

    let audioCtx = null;

    function getAudioContext(createIfMissing = false) {
      if (!audioCtx && createIfMissing) {
        const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
        if (AudioCtxClass) {
          audioCtx = new AudioCtxClass();
        }
      }

    // 4 Nada Chime Airport Elegan
    function playChime() {
      if (!isSoundEnabled) return Promise.resolve();
      return new Promise(function(resolve) {
        try {
          const ctx = getAudioContext();
          if (!ctx) return resolve();
          if (ctx.state === 'suspended') {
            ctx.resume().catch(function() {});
          }

          const notes = [523.25, 659.25, 783.99, 1046.50];
          const noteDuration = 0.22;

          notes.forEach(function(freq, idx) {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * noteDuration);

            gain.gain.setValueAtTime(0, ctx.currentTime + idx * noteDuration);
            gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + idx * noteDuration + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (idx + 1) * noteDuration + 0.3);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(ctx.currentTime + idx * noteDuration);
            osc.stop(ctx.currentTime + (idx + 1) * noteDuration + 0.35);
          });

          setTimeout(resolve, (notes.length * noteDuration + 0.25) * 1000);
        } catch (e) {
          resolve();
        }
      });
    }

    let currentTtsAudio = null;

    function playTtsAudioStream(chunk) {
      return new Promise(function(resolve, reject) {
        try {
          if (currentTtsAudio) {
            try { currentTtsAudio.pause(); currentTtsAudio.currentTime = 0; } catch (e) {}
            currentTtsAudio = null;
          }

          const cleanChunk = chunk.substring(0, 180);
          const ttsUrl = 'https://translate.google.com/translate_tts?ie=UTF-8&tl=id&client=tw-ob&q=' + encodeURIComponent(cleanChunk);
          const audio = new Audio();
          audio.crossOrigin = 'anonymous';
          audio.src = ttsUrl;
          currentTtsAudio = audio;

          audio.onended = function() {
            currentTtsAudio = null;
            resolve();
          };

          audio.onerror = function(err) {
            console.warn('[TTS Audio Stream Error]', err);
            currentTtsAudio = null;
            reject(err);
          };

          const p = audio.play();
          if (p !== undefined) {
            p.catch(function(err) {
              console.warn('[TTS Playback Blocked]', err);
              currentTtsAudio = null;
              reject(err);
            });
          }
        } catch (e) {
          reject(e);
        }
      });
    }

    async function playOnlineTtsSequence(text) {
      const clean = text.replace(/\s+/g, ' ').trim();
      if (!clean) return;

      if (clean.length <= 180) {
        await playTtsAudioStream(clean);
        return;
      }

      const parts = clean.split(/[,.]/);
      let buffer = '';
      const chunks = [];
      for (const p of parts) {
        const item = p.trim();
        if (!item) continue;
        if ((buffer + ', ' + item).length <= 180) {
          buffer = buffer ? (buffer + ', ' + item) : item;
        } else {
          if (buffer) chunks.push(buffer);
          buffer = item;
        }
      }
      if (buffer) chunks.push(buffer);

      for (const chunk of chunks) {
        await playTtsAudioStream(chunk);
      }
    }

    function playSpeechSynthesisLocal(text) {
      return new Promise(function(resolve) {
        if (!('speechSynthesis' in window)) return resolve();
        try {
          const utterance = new SpeechSynthesisUtterance(text);
          utterance.lang = 'id-ID';
          utterance.rate = 0.95;
          utterance.pitch = 1.05;

          const voices = window.speechSynthesis.getVoices();
          const idVoice = voices.find(function(v) {
            return v.lang && (v.lang.toLowerCase().includes('id') || v.lang.toLowerCase().includes('indonesia'));
          });
          if (idVoice) utterance.voice = idVoice;

          let done = false;
          function finish() {
            if (!done) {
              done = true;
              resolve();
            }
          }

          utterance.onend = finish;
          utterance.onerror = finish;

          window.speechSynthesis.speak(utterance);

          // Batas pengaman jika SpeechSynthesis gantung di Smart TV
          setTimeout(finish, 14000);
        } catch (e) {
          console.warn('[SpeechSynthesis Fallback Error]', e);
          resolve();
        }
      });
    }

    async function playDualEngineVoice(text) {
      try {
        // 1. Coba putar via Online TTS Audio Stream (Bekerja 100% di Android TV tanpa perlu paket bahasa lokal di TV)
        await playOnlineTtsSequence(text);
      } catch (err) {
        console.warn('[Online TTS Gagal, Menggunakan SpeechSynthesis]', err);
        // 2. Fallback ke Web Speech API jika offline
        await playSpeechSynthesisLocal(text);
      }
    }

    // Suara Panggilan Text-to-Speech (Dual-Engine: Android TV & PC)

    // Suara Panggilan Text-to-Speech (Dual-Engine: Android TV & PC) - HANYA BUNYI 1X SAJA
    async function announceVoice(text, booking) {
      if (!text) return;

      // DEDUP GUARD: Pastikan suara HANYA berbunyi 1 KALI SAJA (cegah duplikasi dari MQTT + BroadcastChannel)
      const now = Date.now();
      const callKey = ((booking ? (booking.id || booking.queueNumber) : '') + '_' + text).toLowerCase().trim();
      if (lastTvVoiceCallKey === callKey && (now - lastTvVoiceCallTime < 8000)) {
        console.log('[TV Voice Debounced] Panggilan duplikat diabaikan (hanya bunyi 1x).');
        return;
      }
      lastTvVoiceCallKey = callKey;
      lastTvVoiceCallTime = now;

      // Hentikan suara yang sedang aktif agar tidak tumpang tindih
      if ('speechSynthesis' in window) {
        try { window.speechSynthesis.cancel(); } catch (e) {}
      }
      if (currentTtsAudio) {
        try { currentTtsAudio.pause(); currentTtsAudio = null; } catch (e) {}
      }
      // STRICT FILTER AREA: Jika panggilan berasal dari area/cabang lain, abaikan total (tanpa suara & tanpa toast)
      if (booking) {
        const bSite = booking.siteId || booking.siteCode;
        if (bSite && !isSameSite(bSite, currentSiteId)) {
          console.log(`[TV VOICE IGNORED] Panggilan area "${bSite}" diabaikan karena monitor TV berada di area "${currentSiteId}"`);
          return;
        }
      }

      autoUnlockAudioEngine();

      text = text.replace(/^(panggilan\s+(selesai|kedatangan|datang)|perhatian|pendaftaran\s+walk\s*in\s*berhasil)[\.\:\,\-]?[\s]*/gi, '').trim();
      text = text
        .replace(/motor\s+polytron\s+[a-z0-9\-]+/gi, '')
        .replace(/polytron\s+[a-z0-9\-]+/gi, '')
        .replace(/motor\s+polytron/gi, '')
        .replace(/polytron/gi, '')
        .replace(/\bmotor\s+(fox-r|fox-s|fox-500|t-rex|evo)\b/gi, '')
        .replace(/\b(fox-r|fox-s|fox-500|t-rex|evo)\b/gi, '')
        // KOREKSI SUARA: HAPUS ISTILAH EXPRESS A / B DAN KATA "BAY" (KARENA TERDENGAR SEPERTI HURUF "B")
        .replace(/\b(?:stall\s+)?expres(?:s)?\s*(?:bay\s*)?[a-b]\b/gi, 'Stall Express')
        .replace(/\b(?:stall\s+)?expres(?:s)?\s+bay\b/gi, 'Stall Express')
        .replace(/\bstall\s+stall\s+express\b/gi, 'Stall Express')
        .replace(/\bdi\s+express\b/gi, 'di Stall Express')
        .replace(/\balokasi\s+express\b/gi, 'Alokasi Stall Express')
        .replace(/,\s*,/g, ',')
        .replace(/\s{2,}/g, ' ')
        .trim();

      // Tampilkan Popup Panggilan Besar
      showActiveCallToast(booking ? formatCallToastText(booking) : text.toUpperCase());

      if (!isSoundEnabled) {
        // Jika suara dinonaktifkan, beri jeda wajar 4 detik lalu sembunyikan popup
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function() {
          hideActiveCallToast();
        }, 4000);
        return;
      }

      try {
        await playChime();
        await playDualEngineVoice(text);
      } catch (err) {
        console.warn('[Announce Error]', err);
      } finally {
        // POPUP OTOMATIS HILANG BEGITU SUARA PANGGILAN SELESAI / BERHENTI (Diberi jeda halus 500ms)
        setTimeout(function() {
          hideActiveCallToast();
        }, 500);
      }
    }

      const s = /stall.*2/i.test(b.stall) ? 'STALL 2' : (/express/i.test(b.stall) ? 'STALL EXPRESS' : 'STALL 1');
      const parts = [q, n, s].filter(Boolean);
      return parts.join(' • ');

    // ==============================================================
    // DATE & TIME LOGIC
    // ==============================================================
    function getLocalDateIso(dateObj = new Date()) {
      try {
        // Format ISO YYYY-MM-DD menggunakan timezone tegas Asia/Jakarta (WIB)
        return new Intl.DateTimeFormat('en-CA', {
          timeZone: 'Asia/Jakarta',
          year: 'numeric',
          month: '2-digit',
          day: '2-digit'
        }).format(dateObj);
      } catch (e) {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + d;
      }
    }

    function normalizeDateString(rawDate) {
      if (!rawDate) return getLocalDateIso();
      const s = String(rawDate).trim();
      if (!s) return getLocalDateIso();

      const isoMatch = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (isoMatch) {
        return isoMatch[1] + '-' + String(isoMatch[2]).padStart(2, '0') + '-' + String(isoMatch[3]).padStart(2, '0');
      }

      const dmyMatch = s.match(/^(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{4})/);
      if (dmyMatch) {
        return dmyMatch[3] + '-' + String(dmyMatch[2]).padStart(2, '0') + '-' + String(dmyMatch[1]).padStart(2, '0');
      }

      return s;
    }

    function isSaturday(dateStr) {
      if (!dateStr) return false;
      try {
        const parts = String(dateStr).trim().split('-');
        if (parts.length === 3) {
          const d = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
          const day = d.getDay();
          return day === 6 || day === 0; // Sabtu (6) dan Minggu (0): operasional selesai 11.30
        }
      } catch(e) {}
      return false;
    }

    function updateLiveClock() {
      const now = new Date();
      const clockEl = document.getElementById('tvClockDisplay');
      if (clockEl) {
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        clockEl.innerText = `${h}:${m}:${s}`;
      }

      const dateEl = document.getElementById('tvDateDisplay');
      if (dateEl) {
        const days = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        const dayName = days[now.getDay()];
        const fullDate = `${dayName}, ${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()}`.toUpperCase();
        if (dateEl.innerText !== fullDate) {
          dateEl.innerText = fullDate;
        }
      }
    }

    function loadBookings() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (!data) return [];
      try {
        const parsed = JSON.parse(data);
        if (!Array.isArray(parsed)) return [];
        // Pastikan tidak ada data dummy sample lama yang lolos ke monitor TV
        const cleanList = parsed.filter(b => {
          if (!b) return false;
          const id = String(b.id || '');
          const name = String(b.name || '').toLowerCase();
          if (id.startsWith('BKG-') || id.startsWith('PLY-TSM-20261017-') || name.includes('hendra gunawan') || name.includes('rina suminar') || name.includes('konsumen 0') || name.includes('budi santoso')) {
            return false;
          }
          return true;
        });
        if (cleanList.length !== parsed.length) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(cleanList));
        }
        return cleanList.map(b => {
          if (b && b.date) b.date = normalizeDateString(b.date);
          return b;
        });
      } catch (e) {
        return [];
      }
    }

    function getSampleBookings() {
      // Supabase adalah satu-satunya sumber data. Tidak ada lagi data dummy tiruan.
      return [];

    function isSameSlot(slotA, slotB) {
      if (!slotA || !slotB) return false;
      const norm = function(s) { return String(s).replace(':', '.').replace(/\s+/g, '').toLowerCase(); };
      const a = norm(slotA);
      const b = norm(slotB);
      return a === b || a.startsWith(b) || b.startsWith(a);
    }

    function isSameStall(stallA, stallB) {
      if (!stallA || !stallB) return false;
      const norm = function(s) { return String(s).toLowerCase().replace(/[\s\-_]/g, ''); };
      return norm(stallA) === norm(stallB);
    }

    function getNextRegularSlot(slotTime) {
      const times = ['08.30', '09.30', '10.30', '11.30', '12.30', '13.30', '14.30', '15.30', '16.30', '17.30'];
      const norm = String(slotTime || '').replace(':', '.');
      const idx = times.indexOf(norm);
      if (idx !== -1 && idx < times.length - 1) {
        return times[idx + 1];
      }
      return null;
    }

    function isBookingInSlot(b, slotTime) {
      if (!b) return false;
      if (isSameSlot(b.slot, slotTime)) return true;
      if (b.secondarySlot && isSameSlot(b.secondarySlot, slotTime)) return true;
      if (b.estimatedHours >= 2) {
        const next = getNextRegularSlot(b.slot);
        if (next && isSameSlot(next, slotTime)) return true;
      }
      return false;
    }

    function isSameSite(id1, id2) {
      if (!id1 || !id2) return false;
      const s1 = String(id1).toLowerCase().trim();
      const s2 = String(id2).toLowerCase().trim();
      if (s1 === s2) return true;

      const site1 = findSite(s1);
      const site2 = findSite(s2);
      if (site1 && site2) {
        return site1.id === site2.id || (site1.code && site2.code && site1.code === site2.code);
      }

      const clean1 = s1.replace(/polytron/g, '').replace(/service\s*center/g, '').replace(/sc/g, '').replace(/[^a-z0-9]/g, '');
      const clean2 = s2.replace(/polytron/g, '').replace(/service\s*center/g, '').replace(/sc/g, '').replace(/[^a-z0-9]/g, '');
      if (!clean1 || !clean2) return false;
      if (clean1 === clean2) return true;
      if ((clean1 === 'tasik' || clean1 === 'tasikmalaya') && (clean2 === 'tasik' || clean2 === 'tasikmalaya')) return true;

      return false;
    }

    // Helper Express Bay matching (30 menit interval)
    function isExpressBookingMatch(b, targetTime) {
      if (!b) return false;
      const isExp = (b.stall && b.stall.toLowerCase().includes('express')) || 
                    (b.serviceType && b.serviceType.toLowerCase().includes('express'));
      if (!isExp) return false;

      const normTarget = targetTime.replace(':', '.');
      const idx = parseInt(b.slot, 10);
      if (!isNaN(idx) && String(idx) === String(b.slot).trim()) {
        const EXPRESS_SLOTS = [
          '08.30', '09.00', '09.30', '10.00',
          '10.30', '11.00', '11.30', '12.00',
          '12.30', '13.00', '13.30', '14.00',
          '14.30', '15.00', '15.30', '16.00',
          '16.30', '17.00'
        ];
        if (EXPRESS_SLOTS[idx] && EXPRESS_SLOTS[idx] === normTarget) {
          return true;
        }
      }

      const rawSlot = String(b.slot || '').replace(':', '.');
      if (rawSlot.startsWith(normTarget) || rawSlot.includes(normTarget)) {
        return true;
      }

      return false;
    }

    function getExpressTimesForHour(hourStart) {
      const parts = hourStart.split('.');
      const h = parseInt(parts[0], 10);
      const m = parseInt(parts[1], 10);
      
      const t1 = `${String(h).padStart(2, '0')}.${String(m).padStart(2, '0')}`;
      let h2 = h;
      let m2 = m + 30;
      if (m2 >= 60) {
        h2 += 1;
        m2 -= 60;
      }
      const t2 = `${String(h2).padStart(2, '0')}.${String(m2).padStart(2, '0')}`;
      return [t1, t2];
    }

    // ==============================================================
    // RENDER TABEL JADWAL SESUAI PERMINTAAN USER:
    // - Background Merah Gradasi (Sama dengan Menu Lain)
    // - Card Putih Bersih dengan Teks Wrap Rapi
    // - Tepat 2 Kotak per Baris
    // - Ukuran Elastis Mengikuti Layar (Padding 2mm)
    // - Kotak kosong ditampilkan jelas
    // - Batas jam: Sabtu sd 11.30, Selain Sabtu sd 14.30
    // - Filter sesuai Site Aktif (Multi-Site Isolation & Sync)
    // - Multi-Slot Level 2 (2 Jam) Muncul di Kedua Jam
    // ==============================================================
    function renderScheduleTable(force = false) {
      if (isCategorySwitching && !force) return;
      const todayIso = getLocalDateIso();
      const isTvDateSat = isSaturday(todayIso);
      const activeCode = getSiteCode(currentSiteId);

      // Ambil booking hari ini KHUSUS untuk Site yang aktif di monitor ini
      const bookings = loadBookings().filter(function(b) {
        if (b.date !== todayIso) return false;
        if (!b.siteId && !b.siteCode) return true;
        return isSameSite(b.siteId, currentSiteId) || (b.siteCode && b.siteCode === activeCode);
      });

      // Filter slot dinamis:
      // - Default Senin-Jumat: 08.30 s/d 14.30 (7 slot)
      // - Default Sabtu & Minggu: 08.30 s/d 11.30 (4 slot)
      // - Slot Tambahan (15.30 untuk Senin-Jumat, 12.30 & 13.30 untuk Sabtu/Minggu):
      //   Otomatis bertambah jika ADA booking / inputan SA aktif pada kategori ini!
      //   Jika TIDAK ada booking di jam ekstra, slot tidak ditampilkan agar layar tetap rapi.
      let activeSlots = ALL_TV_TIME_SLOTS.filter(function(slot) {
        const isDefault = isTvDateSat ? slot.isSatDefault : slot.isWeekdayDefault;
        if (isDefault) return true;

        const expTimes = getExpressTimesForHour(slot.start);
        const expT1 = expTimes[0];
        const expT2 = expTimes[1];

        if (currentCategory === 'reguler') {
          return bookings.some(function(b) {
            if (b.status === 'Batal') return false;
            const isExp = (b.stall && b.stall.toLowerCase().includes('express')) || 
                          (b.serviceType && b.serviceType.toLowerCase().includes('express'));
            if (isExp) return false;
            return isBookingInSlot(b, slot.start);
          });
        } else {
          return bookings.some(function(b) {
            if (b.status === 'Batal') return false;
            return isExpressBookingMatch(b, expT1) || isExpressBookingMatch(b, expT2);
          });
        }
      });

      // Deteksi waktu saat ini untuk badge "SEKARANG"
      const now = new Date();
      const currentMinutes = now.getHours() * 60 + now.getMinutes();

      const tableBody = document.getElementById('tvTableBody');
      if (!tableBody) return;

      let filledCount = 0;
      let totalSlotsCount = 0;
      let rowsHtml = '';

      activeSlots.forEach(function(slot) {
        const startParts = slot.start.split('.');
        const endParts = slot.end.split('.');
        const startMin = parseInt(startParts[0], 10) * 60 + parseInt(startParts[1], 10);
        const endMin = parseInt(endParts[0], 10) * 60 + parseInt(endParts[1], 10);
        const isCurrentTime = currentMinutes >= startMin && currentMinutes < endMin;

        // 1. Kolom Waktu
        let nowBadgeHtml = isCurrentTime ? '<span class="tv-now-badge">SEKARANG</span>' : '';
        const timeColHtml = `
          <div class="tv-col-time">
            <span class="tv-time-main">${slot.label}</span>
            <span class="tv-time-sub">${slot.sub}</span>
            ${nowBadgeHtml}
          </div>
        `;

        let col1Html = '';
        let col2Html = '';

        if (currentCategory === 'reguler') {
          // ==========================================
          // MODE REGULER: KOTAK 1 (STALL 1) & KOTAK 2 (STALL 2)
          // ==========================================
          totalSlotsCount += 2;
          const isSlotPast = currentMinutes >= endMin;

          // Kotak 1: Stall 1 (Utamakan booking aktif jika diinput oleh SA pada jam istirahat)
          const b1 = bookings.find(function(b) {
            return isSameStall(b.stall, 'stall1') && isBookingInSlot(b, slot.start) && b.status !== 'Batal';
          });
          if (b1) {
            filledCount++;
            col1Html = `<div class="tv-stall-cell tv-col-stall-1">${renderBookingCard(b1, 'STALL 1')}</div>`;
          } else if (slot.start === '12.30' && !isTvDateSat) {
            col1Html = `
              <div class="tv-stall-cell">
                <div class="tv-break-slot">
                  <div class="tv-break-inner">
                    <span class="tv-break-title">ISTIRAHAT</span>
                    <span class="tv-break-sub">12.30 - 13.30</span>
                  </div>
                </div>
              </div>
            `;
          } else {
            col1Html = `
              <div class="tv-stall-cell tv-col-stall-1">
                <div class="tv-empty-box ${isSlotPast ? 'is-past' : ''}">
                  <div class="tv-empty-inner">
                    <span class="tv-empty-title">KOSONG</span>
                    <span class="tv-empty-sub">Stall Tersedia</span>
                  </div>
                </div>
              </div>
            `;
          }

          // Kotak 2: Stall 2 (Utamakan booking aktif jika diinput oleh SA pada jam istirahat)
          const b2 = bookings.find(function(b) {
            return isSameStall(b.stall, 'stall2') && isBookingInSlot(b, slot.start) && b.status !== 'Batal';
          });
          if (b2) {
            filledCount++;
            col2Html = `<div class="tv-stall-cell tv-col-stall-2">${renderBookingCard(b2, 'STALL 2')}</div>`;
          } else if (slot.start === '13.30' && !isTvDateSat) {
            col2Html = `
              <div class="tv-stall-cell">
                <div class="tv-break-slot">
                  <div class="tv-break-inner">
                    <span class="tv-break-title">ISTIRAHAT</span>
                    <span class="tv-break-sub">13.30 - 14.30</span>
                  </div>
                </div>
              </div>
            `;
          } else {
            col2Html = `
              <div class="tv-stall-cell tv-col-stall-2">
                <div class="tv-empty-box ${isSlotPast ? 'is-past' : ''}">
                  <div class="tv-empty-inner">
                    <span class="tv-empty-title">KOSONG</span>
                    <span class="tv-empty-sub">Stall Tersedia</span>
                  </div>
                </div>
              </div>
            `;
          }

        } else {
          // ==========================================
          // MODE EXPRESS: KOTAK 1 (SLOT A) & KOTAK 2 (SLOT B)
          // ==========================================
          totalSlotsCount += 2;
          const expTimes = getExpressTimesForHour(slot.start);
          const expT1 = expTimes[0];
          const expT2 = expTimes[1];

          // Hitung apakah masing-masing sub-slot 30 menit sudah terlewat
          const exp1Parts = expT1.split('.');
          const exp1EndMin = parseInt(exp1Parts[0], 10) * 60 + parseInt(exp1Parts[1], 10) + 30;
          const isExp1Past = currentMinutes >= exp1EndMin;

          const exp2Parts = expT2.split('.');
          const exp2EndMin = parseInt(exp2Parts[0], 10) * 60 + parseInt(exp2Parts[1], 10) + 30;
          const isExp2Past = currentMinutes >= exp2EndMin;

          const bExp1 = bookings.find(function(b) {
            return isExpressBookingMatch(b, expT1) && b.status !== 'Batal';
          });
          const bExp2 = bookings.find(function(b) {
            return isExpressBookingMatch(b, expT2) && b.status !== 'Batal';
          });

          if (bExp1) filledCount++;
          if (bExp2) filledCount++;

          // Kotak 1: Express Slot A
          if (bExp1) {
            col1Html = `<div class="tv-stall-cell tv-col-stall-1">${renderBookingCard(bExp1, `SLOT ${expT1}`)}</div>`;
          } else {
            col1Html = `
              <div class="tv-stall-cell tv-col-stall-1">
                <div class="tv-empty-box ${isExp1Past ? 'is-past' : ''}">
                  <div class="tv-empty-inner">
                    <span class="tv-empty-time-pill">⏱ ${expT1}</span>
                    <span class="tv-empty-title">KOSONG</span>
                    <span class="tv-empty-sub">Express Tersedia</span>
                  </div>
                </div>
              </div>
            `;
          }

          // Kotak 2: Express Slot B
          if (bExp2) {
            col2Html = `<div class="tv-stall-cell tv-col-stall-2">${renderBookingCard(bExp2, `SLOT ${expT2}`)}</div>`;
          } else {
            col2Html = `
              <div class="tv-stall-cell tv-col-stall-2">
                <div class="tv-empty-box ${isExp2Past ? 'is-past' : ''}">
                  <div class="tv-empty-inner">
                    <span class="tv-empty-time-pill">⏱ ${expT2}</span>
                    <span class="tv-empty-title">KOSONG</span>
                    <span class="tv-empty-sub">Express Tersedia</span>
                  </div>
                </div>
              </div>
            `;
          }
        }

        const rowClass = `tv-schedule-row ${isCurrentTime ? 'is-current-time' : ''}`;
        rowsHtml += `<div class="${rowClass}">${timeColHtml}${col1Html}${col2Html}</div>`;
      });

      if (tableBody.dataset.renderedHtml !== rowsHtml) {
        tableBody.dataset.renderedHtml = rowsHtml;
        tableBody.innerHTML = rowsHtml;
      }

      // Update footer info dinamis sesuai site aktif
      const activeSiteObj = SITES.find(s => s.id === currentSiteId) || SITES[0];
      const hoursText = document.getElementById('tvFooterHoursText');
      if (hoursText) {
        hoursText.innerText = isTvDateSat 
          ? 'Batas booking servis 08.30 – 11.30 (Sabtu & Minggu)' 
          : 'Batas booking servis 08.30 – 14.30 (Senin - Jumat)';
      }

      const summaryText = document.getElementById('tvSlotSummaryText');
      if (summaryText) {
        const catLabel = currentCategory === 'reguler' ? 'Reguler' : 'Express';
        summaryText.innerText = `${catLabel}: ${filledCount} / ${totalSlotsCount} Slot Terisi`;
      }
    }

    // Render Kartu: Teks Wrap Rapi (Tanpa Potongan/Ellipsis), Sudut 90 Derajat (Unsharp 3px), Padding 2mm
    function renderBookingCard(b, slotBadgeText) {
      let rawStatus = (b.status || '').toLowerCase();
      let statusKey = 'terjadwal';

      if (rawStatus.includes('selesai') || rawStatus === 'done' || rawStatus === 'completed') {
        statusKey = 'selesai';
      } else if (rawStatus.includes('progres') || rawStatus.includes('progress') || rawStatus.includes('kerja') || rawStatus.includes('qc') || rawStatus.includes('quality')) {
        statusKey = 'dikerjakan';
      } else if (rawStatus.includes('tunggu') || rawStatus.includes('checked') || rawStatus.includes('tiba') || rawStatus.includes('waiting')) {
        statusKey = 'menunggu';
      }

      const name = (b.name || b.queueNumber || 'Konsumen').toUpperCase();
      const complaint = b.complaint || b.serviceType || 'Servis Berkala';
      const plate = b.plate || 'B 0000 XX';
      const model = (b.model || 'Polytron EV').replace('Polytron ', '');

      // Tampilan Express: Jam dibuat rapi sebagai pill di sebelah tipe/model rata kanan
      let timeBadgeHtml = '';
      if (currentCategory === 'express' && slotBadgeText) {
        timeBadgeHtml = `<span class="tv-express-slot-pill">⏱ ${slotBadgeText.replace('SLOT ', '')}</span>`;
      }

      // Sesuai permintaan user: Kotak tetap utuh, status segitiga di pojok kanan atas, jam di sebelah model rata kanan
      return `
        <div class="tv-booking-card status-${statusKey}">
          <svg class="tv-card-corner-triangle triangle-${statusKey}" width="18" height="18" viewBox="0 0 24 24">
            <polygon points="0,0 24,0 24,24" />
          </svg>
          <div class="tv-card-top">
            <span class="tv-card-name" title="${name}">${name}</span>
          </div>
          <div class="tv-card-mid" title="${complaint}">${complaint}</div>
          <div class="tv-card-bot">
            <span class="tv-card-plate">${plate}</span>
            <span style="opacity: 0.6;">•</span>
            <span class="tv-card-model">${model}</span>
            ${timeBadgeHtml}
          </div>
        </div>
      `;
    }

    // ==============================================================
    // SINKRONISASI SUPABASE (SINGLE SOURCE OF TRUTH & EGRESS GUARD)

    let isTvSyncingSupabase = false;

    function mapSupabaseRowToBooking(r) {
      if (!r) return null;
      return {
        id: r.id,
        queueNumber: r.queue_number || r.queueNumber || 'REG-01',
        siteId: r.site_id || r.siteId || 'tasikmalaya',
        siteCode: r.site_code || r.siteCode || 'TSM',
        date: normalizeDateString(r.date),
        slot: String(r.slot || '').replace(':', '.'),
        secondarySlot: r.secondary_slot ? String(r.secondary_slot).replace(':', '.') : (r.secondarySlot ? String(r.secondarySlot).replace(':', '.') : null),
        stall: r.stall || 'stall1',
        level: r.level || 'Level 1',
        estimatedHours: Number(r.estimated_hours || r.estimatedHours || 1),
        complaint: r.complaint || r.notes || 'Servis Berkala',
        notes: r.notes || r.complaint || '',
        model: r.model || 'Polytron Fox-R',
        plate: (r.plate || '').toUpperCase(),
        name: r.name || 'Konsumen',
        phone: r.phone || '',
        status: r.status || 'Terjadwal',
        createdAt: r.created_at,
        updatedAt: r.updated_at
      };
    }

    function mapBookingToSupabaseRow(b) {
      return {
        id: b.id,
        queue_number: b.queueNumber || b.queue_number,
        site_id: b.siteId || b.site_id || 'tasikmalaya',
        site_code: b.siteCode || b.site_code || 'TSM',
        date: b.date,
        slot: b.slot,
        secondary_slot: b.secondarySlot || b.secondary_slot || null,
        stall: b.stall,
        level: b.level || 'Level 1',
        estimated_hours: Number(b.estimatedHours || b.estimated_hours || 1),
        complaint: b.complaint || b.notes || '',
        notes: b.notes || b.complaint || '',
        model: b.model,
        plate: b.plate,
        name: b.name,
        phone: b.phone,
        status: b.status || 'Terjadwal',
        updated_at: new Date().toISOString()
      };
    }

    // TARIK DATA DENGAN PENGHEMATAN KUOTA EGRESS KETAT:
    // Hanya download baris jika remote updated_at lebih baru atau cache lokal belum ada.
    async function syncFromSupabase(isManualForce = false) {
      if (!supabaseClient || isTvSyncingSupabase) return;
      isTvSyncingSupabase = true;

      const syncIcon = document.getElementById('tvSyncIcon');
      const syncLabel = document.getElementById('tvSyncLabel');
      const sheetStatusText = document.getElementById('tvSheetStatusText');
      const sheetDot = document.getElementById('tvSheetDot');

      if (syncIcon) syncIcon.classList.add('animate-spin');
      if (syncLabel) syncLabel.innerText = 'Syncing...';

      try {
        const todayIso = getLocalDateIso();

        // 1. Cek baris terakhir yang diupdate di tabel bookings (Query sangat kecil <80 bytes!)
        const { data: latestRows, error: checkErr } = await supabaseClient
          .from('bookings')
          .select('updated_at')
          .order('updated_at', { ascending: false })
          .limit(1);

        if (checkErr) throw checkErr;

        const remoteLatest = (latestRows && latestRows.length > 0) ? latestRows[0].updated_at : null;
        const localLatest = localStorage.getItem('POLYTRON_TV_LAST_REMOTE_SYNC');
        const localData = localStorage.getItem(STORAGE_KEY);

        // Jika cache sudah ada dan timestamp sama persis, HEMAT EGRESS: jangan download ulang!
        if (!isManualForce && localData && remoteLatest && localLatest === remoteLatest) {
          console.log('[Supabase Egress Guard TV] Cache lokal cocok dengan server. Egress dihemat!');
          if (sheetStatusText) sheetStatusText.innerText = 'Supabase Live';
          if (sheetDot) {
            sheetDot.style.background = '#16a34a';
            sheetDot.style.boxShadow = '0 0 6px #16a34a';
          }
          renderScheduleTable();
          if (syncIcon) syncIcon.classList.remove('animate-spin');
          if (syncLabel) syncLabel.innerText = 'Supabase';
          isTvSyncingSupabase = false;
          return;
        }

        // 2. Ambil seluruh data dari Supabase jika cache belum ada atau remote memiliki perubahan
        console.log('[Supabase Sync TV] Mengambil data antrian dari Supabase...');
        const { data: rows, error: fetchErr } = await supabaseClient
          .from('bookings')
          .select('*')
          .order('date', { ascending: false });

        if (fetchErr) throw fetchErr;

        if (rows && rows.length > 0) {
          const mapped = rows.map(mapSupabaseRowToBooking);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(mapped));
          if (remoteLatest) {
            localStorage.setItem('POLYTRON_TV_LAST_REMOTE_SYNC', remoteLatest);
          }
          renderScheduleTable();
          console.log('[Supabase Sync TV] Sukses memuat ' + mapped.length + ' booking dari Supabase.');
        } else {
          // Jika Supabase kosong (0 data), monitor TV juga bersih/kosong 100%!
          localStorage.setItem(STORAGE_KEY, '[]');
          localStorage.removeItem('POLYTRON_TV_LAST_REMOTE_SYNC');
          renderScheduleTable();
          console.log('[Supabase Sync TV] Supabase kosong (0 booking aktif).');
        }

        if (sheetStatusText) sheetStatusText.innerText = 'Supabase Live';
        if (sheetDot) {
          sheetDot.style.background = '#16a34a';
          sheetDot.style.boxShadow = '0 0 6px #16a34a';
        }
      } catch (err) {
        console.warn('[Supabase Sync TV Error]', err);
        if (sheetStatusText) sheetStatusText.innerText = 'Offline Cache';
        if (sheetDot) {
          sheetDot.style.background = '#f59e0b';
          sheetDot.style.boxShadow = '0 0 6px #f59e0b';
        }
        renderScheduleTable();
      } finally {
        if (syncIcon) syncIcon.classList.remove('animate-spin');
        if (syncLabel) syncLabel.innerText = 'Supabase';
        isTvSyncingSupabase = false;
      }
    }

    function manualSyncFromSheet() {
      syncFromSupabase(true);
    }

    // REALTIME WEBSOCKET SUPABASE (Menerima perubahan baris secara instan tanpa polling!)
    function initSupabaseRealtime() {
      if (!supabaseClient) return;

      try {
        const channel = supabaseClient
          .channel('public:bookings-tv')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, (payload) => {
            console.log('[Supabase Realtime TV] Event diterima:', payload.eventType, payload);
            handleSupabaseBookingChange(payload);
          })
          .subscribe((status) => {
            console.log('[Supabase Realtime TV] Channel status:', status);
            const sheetStatusText = document.getElementById('tvSheetStatusText');
            const sheetDot = document.getElementById('tvSheetDot');
            if (status === 'SUBSCRIBED') {
              if (sheetStatusText) sheetStatusText.innerText = 'Supabase Live';
              if (sheetDot) {
                sheetDot.style.background = '#16a34a';
                sheetDot.style.boxShadow = '0 0 6px #16a34a';
              }
            }
          });
      } catch (errRt) {
        console.warn('[Supabase Realtime Init Error]', errRt);
      }
    }

    function handleSupabaseBookingChange(payload) {
      let currentBookings = loadBookings();

      if (payload.eventType === 'INSERT') {
        const newB = mapSupabaseRowToBooking(payload.new);
        const idx = currentBookings.findIndex(b => b.id === newB.id);
        if (idx !== -1) {
          currentBookings[idx] = newB;
        } else {
          currentBookings.push(newB);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentBookings));
        if (payload.new && payload.new.updated_at) {
          localStorage.setItem('POLYTRON_TV_LAST_REMOTE_SYNC', payload.new.updated_at);
        }
        renderScheduleTable();

        // Tampilkan info notifikasi booking baru di TV
        const isExp = (newB.stall && newB.stall.toLowerCase().includes('express')) || (newB.serviceType && newB.serviceType.toLowerCase().includes('express'));
        const catLabel = isExp ? 'Express' : 'Reguler';
        showActiveCallToast('📢 Booking ' + catLabel + ' Masuk: ' + (newB.plate || '') + ' (' + (newB.name || 'Konsumen') + ')');
        setTimeout(hideActiveCallToast, 4000);
      } else if (payload.eventType === 'UPDATE') {
        const updatedB = mapSupabaseRowToBooking(payload.new);
        const idx = currentBookings.findIndex(b => b.id === updatedB.id);
        if (idx !== -1) {
          currentBookings[idx] = updatedB;
        } else {
          currentBookings.push(updatedB);
        }
        localStorage.setItem(STORAGE_KEY, JSON.stringify(currentBookings));
        if (payload.new && payload.new.updated_at) {
          localStorage.setItem('POLYTRON_TV_LAST_REMOTE_SYNC', payload.new.updated_at);
        }
        renderScheduleTable();
      } else if (payload.eventType === 'DELETE') {
        const deletedId = payload.old ? payload.old.id : null;
        if (deletedId) {
          currentBookings = currentBookings.filter(b => b.id !== deletedId);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(currentBookings));
          renderScheduleTable();
        }
      }
    }
