    // PING OTOMATIS SETIAP 24 JAM UNTUK MENCEGAH SUPABASE TIDAK SLEEP / PAUSE
    function runDailySupabaseKeepAlivePing() {
      if (!supabaseClient) return;
      const KEY = 'POLYTRON_SUPABASE_LAST_PING_MS';
      const lastPing = parseInt(localStorage.getItem(KEY) || '0', 10);
      const now = Date.now();
      if (!lastPing || (now - lastPing > 24 * 60 * 60 * 1000)) {
        supabaseClient.from('ping_log').insert([{ source: 'tv_monitor_24h' }]).then(() => {
          localStorage.setItem(KEY, String(now));
          console.log('✅ [Supabase Keep-Alive] Ping 24 jam berhasil dikirim agar Supabase tidak sleep.');
        }).catch(err => {
          console.warn('[Supabase Keep-Alive Error]', err);
        });
      }
    }

    // ==============================================================
    // FULLSCREEN TOGGLE
    // ==============================================================
    // ==============================================================
    // ROTASI MONITOR TV (LANDSCAPE / PORTRAIT 90° / PORTRAIT 270°)
    // ==============================================================
    const ROTATION_KEY = 'POLYTRON_TV_ROTATION';
    let currentTvRotation = parseInt(localStorage.getItem(ROTATION_KEY) || '0', 10);
    if (isNaN(currentTvRotation)) currentTvRotation = 0;

    function fitTvScreen() {
      const wrapper = document.getElementById('tvScreenWrapper');
      if (!wrapper) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      if (currentTvRotation === 90 || currentTvRotation === 270) {
        wrapper.style.width = h + 'px';
        wrapper.style.height = w + 'px';
        wrapper.style.maxWidth = h + 'px';
        wrapper.style.maxHeight = w + 'px';
      } else {
        wrapper.style.width = '100%';
        wrapper.style.height = '100%';
        wrapper.style.maxWidth = '100%';
        wrapper.style.maxHeight = '100%';
      }
    }

    function applyTvRotation(rot) {
      currentTvRotation = rot;
      localStorage.setItem(ROTATION_KEY, String(rot));
      document.body.classList.remove('tv-rot-0', 'tv-rot-90', 'tv-rot-180', 'tv-rot-270');
      document.body.classList.add(`tv-rot-${rot}`);

      fitTvScreen();

      // Coba kunci screen orientation jika browser & device mendukung
      if (screen.orientation && screen.orientation.lock) {
        try {
          if (rot === 90 || rot === 270) {
            screen.orientation.lock('portrait').catch(function() {});
          } else {
            screen.orientation.lock('landscape').catch(function() {});
          }
        } catch (e) {}
      }
    }

    window.addEventListener('resize', fitTvScreen);
    window.addEventListener('fullscreenchange', fitTvScreen);
    window.addEventListener('webkitfullscreenchange', fitTvScreen);

    // ==============================================================
    // KONTROL TEMA MONITOR TV (TERANG GRADASI / AGAK GELAP)
    // ==============================================================
    const TV_THEME_KEY = 'polytron_tv_theme';
    let currentTvTheme = localStorage.getItem(TV_THEME_KEY) || 'light';

    function setTvTheme(theme) {
      currentTvTheme = (theme === 'dark') ? 'dark' : 'light';
      document.body.classList.remove('theme-light', 'theme-dark');
      document.body.classList.add('theme-' + currentTvTheme);
      try { localStorage.setItem(TV_THEME_KEY, currentTvTheme); } catch(e) {}

      const icon = document.getElementById('tvThemeIcon');
      const btn = document.getElementById('btnTvTheme');
      if (icon) {
        if (currentTvTheme === 'dark') {
          icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>';
          if (btn) btn.title = 'Ganti ke Tema Terang (Gradasi)';
        } else {
          icon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>';
          if (btn) btn.title = 'Ganti ke Tema Agak Gelap (Abu-abu)';
        }
      }
    }

    function toggleTvTheme() {
      const nextTheme = (currentTvTheme === 'light') ? 'dark' : 'light';
      setTvTheme(nextTheme);
    }

    function toggleTvRotation() {
      // Siklus rotasi: 0° -> 90° -> 270° -> 0°
      let nextRot = 0;
      if (currentTvRotation === 0) {
        nextRot = 90;
      } else if (currentTvRotation === 90) {
        nextRot = 270;
      } else {
        nextRot = 0;
      }
      applyTvRotation(nextRot);
    }

    let isTvFullscreen = false;

    function toggleFullScreen() {
      autoUnlockAudioEngine();
      const isFs = !!(document.fullscreenElement || document.webkitFullscreenElement);

      if (!isFs) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().then(function() {
            setFullscreenState(true);
          }).catch(function() {
            setFullscreenState(true);
          });
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
          setFullscreenState(true);
        } else {
          setFullscreenState(true);
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().then(function() {
            setFullscreenState(false);
          }).catch(function() {
            setFullscreenState(false);
          });
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
          setFullscreenState(false);
        } else {
          setFullscreenState(false);
        }
      }
    }

    function setFullscreenState(isFs) {
      isTvFullscreen = isFs;
      const fsIcon = document.getElementById('btnFsIcon');
      const fsBtn = document.getElementById('btnFullscreenToggle');
      if (isFs) {
        document.documentElement.classList.add('tv-mode-fullscreen');
        document.body.classList.add('tv-mode-fullscreen');
        if (fsIcon) {
          fsIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>';
        }
        if (fsBtn) fsBtn.title = 'Keluar Mode Layar Penuh (F / Esc)';
      } else {
        document.documentElement.classList.remove('tv-mode-fullscreen');
        document.body.classList.remove('tv-mode-fullscreen');
        if (fsIcon) {
          fsIcon.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>';
        }
        if (fsBtn) fsBtn.title = 'Mode Layar Penuh (F)';
      }
      renderScheduleTable();
    }

    document.addEventListener('fullscreenchange', function() {
      setFullscreenState(!!(document.fullscreenElement || document.webkitFullscreenElement));
    });

    // ==============================================================
    // KONTROL NAVIGASI REMOT SMART TV (D-PAD ARROW & OK/ENTER)
    // ==============================================================
    const TV_REMOTE_NAV = {
      rows: [
        ['btnCatReguler', 'btnCatExpress'],
        ['tvSiteSelector', 'btnTvReload', 'btnRotationToggle', 'btnTvTheme', 'btnFullscreenToggle', 'btnTvMenu']
      ],
      currentRow: 1,
      currentCol: 4, // Default fokus ke tombol Fullscreen

      getFocusedElement() {
        const id = this.rows[this.currentRow]?.[this.currentCol];
        return id ? document.getElementById(id) : null;
      },

      setFocus(row, col) {
        if (row < 0) row = 0;
        if (row >= this.rows.length) row = this.rows.length - 1;
        const maxCol = this.rows[row].length - 1;
        if (col < 0) col = 0;
        if (col > maxCol) col = maxCol;

        this.currentRow = row;
        this.currentCol = col;

        // Bersihkan fokus visual lama
        document.querySelectorAll('.tv-remote-focused').forEach(el => el.classList.remove('tv-remote-focused'));

        const el = this.getFocusedElement();
        if (el) {
          el.focus();
          el.classList.add('tv-remote-focused');
          const parentBox = el.closest('.tv-site-box');
          if (parentBox) parentBox.classList.add('tv-remote-focused');
        }
      },

      move(direction) {
        enforceAutoFullscreenAndLandscape();

        if (direction === 'left') {
          if (this.currentCol > 0) {
            this.setFocus(this.currentRow, this.currentCol - 1);
          } else {
            this.setFocus(this.currentRow, this.rows[this.currentRow].length - 1);
          }
        } else if (direction === 'right') {
          if (this.currentCol < this.rows[this.currentRow].length - 1) {
            this.setFocus(this.currentRow, this.currentCol + 1);
          } else {
            this.setFocus(this.currentRow, 0);
          }
        } else if (direction === 'up') {
          if (this.currentRow > 0) {
            const ratio = this.currentCol / (this.rows[this.currentRow].length - 1);
            const targetCol = Math.round(ratio * (this.rows[0].length - 1));
            this.setFocus(0, targetCol);
          }
        } else if (direction === 'down') {
          if (this.currentRow < this.rows.length - 1) {
            const ratio = this.currentCol / (this.rows[0].length - 1);
            const targetCol = Math.round(ratio * (this.rows[1].length - 1));
            this.setFocus(1, targetCol);
          }
        }
      },

      activate() {
        const el = this.getFocusedElement();
        if (!el) return;

        // Efek visual klik cepat
        el.style.transform = 'scale(0.92)';
        setTimeout(() => { el.style.transform = ''; }, 140);

        if (el.id === 'tvSiteSelector') {
          cycleNextTvSite();
        } else if (el.id === 'btnTvMenu') {
          window.location.href = 'index_app.html';
        } else {
          el.click();
        }
      }
    };

    function cycleNextTvSite() {
      const sel = document.getElementById('tvSiteSelector');
      if (!sel || !sel.options || sel.options.length <= 1) return;
      let nextIdx = sel.selectedIndex + 1;
      if (nextIdx >= sel.options.length) {
        nextIdx = 0;
      }
      sel.selectedIndex = nextIdx;
      handleTvSiteChange(sel.value);

      // Tampilkan toast indikator cabang aktif
      const activeObj = SITES.find(s => s.id === sel.value) || { name: sel.value.toUpperCase() };
      showActiveCallToast('📍 Cabang Aktif: ' + activeObj.name);
      setTimeout(hideActiveCallToast, 2500);
    }

    // LISTENER TOMBOL REMOT SMART TV (D-PAD ARROW & OK/ENTER)
    window.addEventListener('keydown', function(e) {
      const key = e.key;
      const code = e.keyCode;

      // Smart TV Keycodes:
      // ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40
      // Enter: 13, Android DPad Center: 23, Select
      if (key === 'ArrowLeft' || code === 37) {
        e.preventDefault();
        TV_REMOTE_NAV.move('left');
      } else if (key === 'ArrowRight' || code === 39) {
        e.preventDefault();
        TV_REMOTE_NAV.move('right');
      } else if (key === 'ArrowUp' || code === 38) {
        e.preventDefault();
        TV_REMOTE_NAV.move('up');
      } else if (key === 'ArrowDown' || code === 40) {
        e.preventDefault();
        TV_REMOTE_NAV.move('down');
      } else if (key === 'Enter' || code === 13 || code === 23 || key === 'Select') {
        e.preventDefault();
        TV_REMOTE_NAV.activate();
      } else if (key === 'f' || key === 'F') {
        toggleFullScreen();
      } else if (key === 'r' || key === 'R') {
        toggleTvRotation();
      } else if (key === 't' || key === 'T') {
        toggleTvTheme();
      }
    });

    // OTOMATIS LAYAR FULLSCREEN & LANDSCAPE SAAT BUKA LINK
    function enforceAutoFullscreenAndLandscape() {
      // 1. Kunci mode landscape
      if (screen.orientation && screen.orientation.lock) {
        try {
          screen.orientation.lock('landscape').catch(() => {});
        } catch (e) {}
      }
      // 2. Minta mode Fullscreen
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const el = document.documentElement;
        const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (rfs) {
          try {
            rfs.call(el).then(() => setFullscreenState(true)).catch(() => setFullscreenState(true));
          } catch (e) {
            setFullscreenState(true);
          }
        } else {
          setFullscreenState(true);
        }
      }
    }

    // ==============================================================
    // REALTIME MQTT LISTENER (KONEKSI DENGAN HP ADMIN / SA)
    // ==============================================================
    function initRealtimeSync() {
      // 1. BroadcastChannel untuk sinkronisasi instan antar-tab pada browser yang sama
      try {
        if ('BroadcastChannel' in window) {
          const bc = new BroadcastChannel('polytron_ev_sync_channel');
          bc.onmessage = function(event) {
            if (!event.data) return;

            // Sinkronkan cabang jika tab operasional mengubah area aktif
            if (event.data.type === 'SITE_CHANGED' && event.data.siteId) {
              if (event.data.siteId !== currentSiteId) {
                handleTvSiteChange(event.data.siteId, true);
              }
              return;
            }

            // Isolasi Site: Jika antrian / event milik site lain, monitor abaikan
            const bcSite = event.data.siteId || event.data.siteCode || (event.data.booking && (event.data.booking.siteId || event.data.booking.siteCode));
            if (bcSite && !isSameSite(bcSite, currentSiteId)) {
              return;
            }

            if (event.data.type === 'BOOKING_UPDATED' || event.data.type === 'REFRESH_TV' || event.data.type === 'data_sync') {
              if (event.data.bookings && Array.isArray(event.data.bookings)) {
                const oldJson = localStorage.getItem(STORAGE_KEY) || '[]';
                const newJson = JSON.stringify(event.data.bookings);
                if (oldJson !== newJson) {
                  localStorage.setItem(STORAGE_KEY, newJson);
                  renderScheduleTable();
                }
              }
            } else if (event.data.type === 'CALL_QUEUE' || event.data.type === 'voice_call') {
              // STRICT: Hanya bunyikan suara jika area panggilan 100% cocok dengan currentSiteId monitor TV
              if (!bcSite || !isSameSite(bcSite, currentSiteId)) {
                console.log(`[BC VOICE IGNORED] Panggilan area "${bcSite || 'tanpa-area'}" diabaikan (monitor di area "${currentSiteId}")`);
                return;
              }
              announceVoice(event.data.text || event.data.message || 'Panggilan antrian', event.data.booking);
            }
          };
        }
      } catch (e) {}

      // 2. Storage event listener untuk sinkronisasi antar-tab saat tab lain mengubah area aktif
      window.addEventListener('storage', function(e) {
        if (e.key === SITE_KEY || e.key === 'POLYTRON_ACTIVE_SITE_ID') {
          if (e.newValue && e.newValue !== currentSiteId) {
            handleTvSiteChange(e.newValue, true);
          }
        }
      });

      // 3. MQTT over WebSocket untuk sinkronisasi antar-perangkat berbeda
      if (typeof mqtt !== 'undefined' && mqtt.connect) {
        try {
          const brokerUrl = 'wss://broker.emqx.io:8084/mqtt';
          const topicSiteSync = 'polytron/ev/global/site_sync';
          const topicDataSync = 'polytron/ev_service/data_sync';
          const topicAllCall = 'polytron/ev/+/call';
          const topicAllSync = 'polytron/ev/+/sync';

          globalMqttClient = mqtt.connect(brokerUrl, {
            clientId: 'tv_monitor_' + Math.random().toString(36).substring(2, 8),
            clean: true,
            connectTimeout: 5000,
            reconnectPeriod: 5000
          });

          globalMqttClient.on('connect', function() {
            globalMqttClient.subscribe([
              topicSiteSync,
              topicDataSync,
              topicAllCall,
              topicAllSync,
              'polytron/ev_service/voice_call',
              'polytron/ev_service/data_sync'
            ]);
          });

          globalMqttClient.on('message', function(t, message) {
            try {
              const payload = JSON.parse(message.toString());
              if (!payload) return;

              // 1. Sinkronkan cabang jika ada siaran pergantian area dari perangkat lain
              if (payload.type === 'SITE_CHANGED' && payload.siteId) {
                if (payload.siteId !== currentSiteId) {
                  handleTvSiteChange(payload.siteId, true);
                }
                return;
              }

              // 2. Isolasi Antrian: Abaikan panggilan / data dari site lain
              const payloadSite = payload.siteId || payload.siteCode || (payload.booking && (payload.booking.siteId || payload.booking.siteCode));
              if (payloadSite && !isSameSite(payloadSite, currentSiteId)) {
                return;
              }

              const parts = t.split('/');
              if (parts.length >= 3 && parts[1] === 'ev' && parts[2] !== 'global') {
                const topicSite = parts[2];
                if (!isSameSite(topicSite, currentSiteId)) {
                  return;
                }
              }

              // 3. Panggilan Suara & Refresh Jadwal (Hanya jika cabang sama)
              if (t.endsWith('/call') || t.endsWith('/voice_call') || payload.type === 'CALL_QUEUE' || payload.type === 'voice_call') {
                // STRICT: Hanya bunyikan suara jika area panggilan 100% cocok dengan currentSiteId monitor TV
                if (!payloadSite || !isSameSite(payloadSite, currentSiteId)) {
                  console.log(`[MQTT VOICE IGNORED] Panggilan area "${payloadSite || 'tanpa-area'}" diabaikan (monitor area "${currentSiteId}")`);
                  return;
                }
                announceVoice(payload.text || payload.message || 'Panggilan antrian', payload.booking);
              } else if (t.endsWith('/sync') || t.endsWith('/data_sync') || payload.type === 'BOOKING_UPDATED' || payload.type === 'DATA_SYNC' || payload.type === 'data_sync') {
                if (payload.bookings && Array.isArray(payload.bookings)) {
                  const oldJson = localStorage.getItem(STORAGE_KEY) || '[]';
                  const newJson = JSON.stringify(payload.bookings);
                  if (oldJson !== newJson) {
                    localStorage.setItem(STORAGE_KEY, newJson);
                    renderScheduleTable();
                  }
                }
              }
            } catch (e) {}
          });
        } catch (e) {}
      }
    }

    // ==============================================================
    // INISIALISASI HALAMAN
    // ==============================================================
    window.addEventListener('DOMContentLoaded', function() {
      // Terapkan preferensi tema monitor TV (Terang Gradasi / Agak Gelap)
      setTvTheme(currentTvTheme);

      // Terapkan preferensi rotasi monitor TV (Landscape / Portrait)
      applyTvRotation(currentTvRotation);

      // Inisialisasi site aktif dan dropdown cabang dinamis
      initTvSiteDropdown();
      handleTvSiteChange(currentSiteId, true);
      setViewCategory(currentCategory);
      autoUnlockAudioEngine();
      updateLiveClock();
      setInterval(updateLiveClock, 1000);

      if (new URLSearchParams(window.location.search).get('category') === 'express' || window.location.hash.includes('express')) {
        setViewCategory('express');
      }

      // OTOMATIS LANGSUNG FULLSCREEN SAAT MASUK WEB ATAU REFRESH
      setFullscreenState(true);

      function tryAutoFullscreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
          const el = document.documentElement;
          const rfs = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
          if (rfs) {
            rfs.call(el).then(function() {
              setFullscreenState(true);
            }).catch(function() {
              setFullscreenState(true);
            });
          } else {
            setFullscreenState(true);
          }
        }
      }

      // Jalankan fullscreen & landscape seketika saat DOM siap
      enforceAutoFullscreenAndLandscape();
      tryAutoFullscreen();
      setTimeout(tryAutoFullscreen, 50);
      setTimeout(tryAutoFullscreen, 150);
      setTimeout(tryAutoFullscreen, 300);
      setTimeout(tryAutoFullscreen, 600);
      setTimeout(tryAutoFullscreen, 1200);
      setTimeout(tryAutoFullscreen, 2500);

      // Pemicu otomatis dari interaksi apa pun (gerakan mouse, remote TV, tombol panah/enter, sentuhan layar)
      const autoFsEvents = ['mousemove', 'pointermove', 'focus', 'mouseenter', 'wheel', 'keydown', 'keyup', 'touchstart', 'pointerdown', 'click'];
      autoFsEvents.forEach(function(evt) {
        window.addEventListener(evt, function() {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            tryAutoFullscreen();
          }
        }, { passive: true });
        document.addEventListener(evt, function() {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            tryAutoFullscreen();
          }
        }, { passive: true });
      });

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          tryAutoFullscreen();
        }
      });

      window.addEventListener('load', function() {
        tryAutoFullscreen();
      });

      // Tarik master sites dari Supabase (atau cache jika sudah ada)
      syncMasterSitesFromSupabase();

      renderScheduleTable();
      setInterval(renderScheduleTable, 15000);

      // Mulai rotasi kategori reguler & express otomatis
      startTvCategoryRotation();

      initRealtimeSync();

      // Inisialisasi Supabase Realtime & ambil data awal (Egress Guard)
      syncFromSupabase();
      initSupabaseRealtime();
      runDailySupabaseKeepAlivePing();

      // Cek berkala tiap 30 detik (Egress Guard query sangat ringan <80 byte)
      setInterval(function() {
        syncFromSupabase();
      }, 30000);

      setTimeout(checkHostingVersionUpdate, 2000);
      setInterval(checkHostingVersionUpdate, 30000);
    });
  </script>
